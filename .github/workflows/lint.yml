name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !.github/ISSUE_TEMPLATE/*.md
            !.github/PULL_REQUEST_TEMPLATE.md

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .ai/adapters

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap and installer tests
        run: make test
